<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Invoice | Roohira Collection</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 20px; background: #fdfdfd; color: #333; font-family: 'Inter', sans-serif; }
        .invoice-wrapper { max-width: 900px; margin: 0 auto; background: white; padding: 40px; border: 1px solid #eee; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.02); }
        .page-break { page-break-before: always; border-top: 2px dashed #eee; margin-top: 50px; padding-top: 50px; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; background: #f9fafb; padding: 12px; font-weight: 700; color: #1f2937; border-bottom: 2px solid #e5e7eb; }
        td { padding: 12px; border-bottom: 1px solid #f3f4f6; }
        .master-header { text-align: center; margin-bottom: 40px; border-bottom: 2px solid #e91e63; padding-bottom: 20px; }
        .master-header h1 { color: #e91e63; font-family: 'Playfair Display', serif; margin: 0; font-size: 32px; }
        
        .print-btn { display: block; width: 200px; margin: 20px auto; padding: 10px; background: #e91e63; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; text-align: center; font-size: 16px; }
        @media print { .print-btn { display: none; } }
    </style>
</head>
<body>
    <button class="print-btn" onclick="window.print()">Print / Save PDF</button>
    <div id="invoice-container">
        <div style="text-align: center; padding: 50px;">
            <p>Loading invoice...</p>
        </div>
    </div>

    <!-- Load script.js to access products and STICKERS arrays -->
    <script src="script.js"></script>


    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const dataParam = urlParams.get('data');
            
            if (!dataParam) {
                document.getElementById('invoice-container').innerHTML = '<h2 style="text-align:center; color: red;">Error: No invoice data found in URL.</h2>';
                return;
            }

                // Robust Base64 Decoding with Unicode Support and padding fix
                let base64 = dataParam.replace(/-/g, '+').replace(/_/g, '/').replace(/ /g, '+');
                while (base64.length % 4) base64 += '=';
                
                const decodedStr = decodeURIComponent(escape(atob(base64)));
                const d = JSON.parse(decodedStr);
                
                if (!Array.isArray(d)) throw new Error("Data format mismatch.");

                const orderData = {
                    id: "ORD-RO-" + (d[0] || "XXXX"),
                    date: new Date().toISOString(),
                    name: d[1] || "Customer",
                    phone: d[2] || "-",
                    address: d[3] || "-",
                    city: d[4] || "-",
                    note: d[5] || "",
                    items: (d[6] || []).map(itemArr => {
                        const productId = itemArr[0];
                        const product = typeof products !== 'undefined' ? products.find(p => p.id === productId) : null;
                        
                        // Safer Color/Size parsing
                        let fullSizeStr = itemArr[1] || "";
                        let colorName = "";
                        try {
                            if (fullSizeStr.includes('|')) {
                                const parts = fullSizeStr.split('|');
                                const colorPart = parts.find(p => p.toLowerCase().includes('color:'));
                                if (colorPart) colorName = colorPart.split(':')[1]?.trim() || "";
                            }
                        } catch(err) { console.warn("Color parse error", err); }
                        
                        let image = "";
                        if (product) {
                            if (colorName && product.colors) {
                                const c = product.colors.find(c => c.name === colorName);
                                image = c ? c.image : product.images[0];
                            } else {
                                image = product.images[0];
                            }
                        }

                        return {
                            id: productId,
                            name: product ? product.name : "Product #" + productId,
                            size: fullSizeStr,
                            qty: itemArr[2] || 1,
                            price: itemArr[3] || 0,
                            image: image || "https://via.placeholder.com/100?text=Product",
                            stickers: [] // Stickers removed
                        };
                    }),
                    total: (d[6] || []).reduce((acc, itemArr) => acc + ((itemArr[2] || 0) * (itemArr[3] || 0)), 0)
                };
                
                renderInvoice(orderData);
            } catch (e) {
                console.error("Critical Invoice Error:", e);
                document.getElementById('invoice-container').innerHTML = `
                    <div style="text-align:center; padding: 40px; border: 2px dashed #ff4d4d; border-radius: 20px; background: #fff5f5;">
                        <h2 style="color: #ff4d4d;">Invoice Loading Error</h2>
                        <p style="color: #666;">We couldn't load the bill details from this link.</p>
                        <div style="margin: 20px 0; background: white; padding: 15px; border-radius: 10px; font-size: 0.8rem; color: #999; text-align: left; overflow-x: auto;">
                            <b>Error:</b> ${e.message}<br>
                            <b>Data Snippet:</b> ${dataParam ? dataParam.substring(0, 50) + "..." : "Empty"}
                        </div>
                        <p style="font-size: 0.9rem;">Please try placing the order again or contact us directly.</p>
                        <button onclick="location.reload()" style="margin-top: 10px; padding: 10px; border-radius: 5px; cursor: pointer;">Retry Refresh</button>
                    </div>
                `;
            }
        });

        function renderInvoice(order) {
            const dateStr = new Date(order.date).toLocaleDateString();
            
            let itemsHtml = '';
            order.items.forEach(item => {
                itemsHtml += `
                <tr>
                    <td style="padding: 12px; border-bottom: 1px solid #eee;">
                        <img src="${item.image}" alt="" style="width: 60px; height: 60px; object-fit: cover; border-radius: 4px;" onerror="this.src='https://via.placeholder.com/60?text=No+Image'">
                    </td>
                    <td style="padding: 12px; border-bottom: 1px solid #eee;">
                        <div style="font-weight: 700; font-size: 10pt; margin-bottom: 4px;">${item.name}</div>
                        <div style="font-size: 8pt; color: #777; line-height: 1.4;">Size: ${item.size}</div>
                    </td>
                    <td style="padding: 12px; border-bottom: 1px solid #eee; text-align: center; font-size: 10pt;">${item.qty}</td>
                    <td style="padding: 12px; border-bottom: 1px solid #eee; text-align: right; font-size: 10pt;">Rs. ${item.price.toLocaleString()}</td>
                    <td style="padding: 12px; border-bottom: 1px solid #eee; text-align: right; font-size: 10pt; font-weight: 700;">Rs. ${(item.price * item.qty).toLocaleString()}</td>
                </tr>
                `;
            });

            const html = `
                <div class="invoice-wrapper">
                    <div class="master-header">
                        <h1>ROOHIRA COLLECTION</h1>
                        <p style="text-transform: uppercase; letter-spacing: 2px; font-size: 11px; color: #999;">OFFICIAL ORDER INVOICE</p>
                    </div>
                    
                    <div style="display: flex; justify-content: space-between; border-bottom: 2px solid #eee; padding-bottom: 20px; margin-bottom: 20px;">
                        <div>
                            <h2 style="margin: 0; color: #e91e63; font-size: 24px; margin-bottom: 10px;">INVOICE</h2>
                            <p style="margin: 0; color: #666; font-size: 14px; font-weight: 600;">Date: ${dateStr}</p>
                            <p style="margin: 0; color: #666; font-size: 14px; font-weight: 600;">Order ID: ${order.id}</p>
                        </div>
                        <div style="text-align: right; background: #fafafa; padding: 15px; border-radius: 8px; border: 1px solid #eee;">
                            <h3 style="margin: 0 0 10px 0; font-size: 12px; color: #999; text-transform: uppercase;">Customer Details</h3>
                            <p style="margin: 0; font-weight: 700; font-size: 15px;">${order.name}</p>
                            <p style="margin: 4px 0 0 0; color: #666; font-size: 13px;">${order.phone}</p>
                            <p style="margin: 4px 0 0 0; color: #666; font-size: 13px;">${order.address}, ${order.city}</p>
                        </div>
                    </div>

                    ${order.note ? `
                    <div style="background: #fff8e1; padding: 15px; border-left: 4px solid #ffc107; border-radius: 4px; margin-bottom: 20px;">
                        <strong>Note:</strong> ${order.note}
                    </div>` : ''}

                    <table style="margin-bottom: 20px;">
                        <thead>
                            <tr>
                                <th style="width: 80px;">Item</th>
                                <th>Description</th>
                                <th style="text-align: center; width: 60px;">Qty</th>
                                <th style="text-align: right; width: 100px;">Price</th>
                                <th style="text-align: right; width: 120px;">Total</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${itemsHtml}
                        </tbody>
                    </table>

                    <div style="display: flex; justify-content: flex-end;">
                        <div style="width: 300px; background: #fafafa; padding: 20px; border-radius: 8px; border: 1px solid #eee;">
                            <div style="display: flex; justify-content: space-between; font-size: 18px; font-weight: 800; color: #e91e63;">
                                <span>Grand Total:</span>
                                <span>Rs. ${order.total.toLocaleString()}</span>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div style="text-align: center; margin-top: 50px; color: #bbb; font-size: 11px;">
                    © 2026 ROOHIRA COLLECTION. ALL RIGHTS RESERVED.
                </div>
            `;
            
            document.getElementById('invoice-container').innerHTML = html;
        }
    </script>
</body>
</html>
