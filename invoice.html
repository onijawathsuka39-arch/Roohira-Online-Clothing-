<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice | Roohira Collection</title>
    <!-- Load products early -->
    <script src="script.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #e91e63; --text: #333; --bg: #f8f9fa; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; padding: 20px; color: var(--text); line-height: 1.6; }
        .invoice-container { max-width: 850px; margin: 0 auto; background: white; padding: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border-radius: 12px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 20px; margin-bottom: 30px; }
        .logo-section h1 { margin: 0; color: var(--primary); font-family: 'Playfair Display', serif; font-size: 28px; }
        .order-info { text-align: right; }
        .details-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-bottom: 30px; }
        .customer-info, .business-info { background: #fafafa; padding: 20px; border-radius: 8px; border: 1px solid #eee; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 30px; }
        th { background: #fdf2f8; color: var(--primary); text-align: left; padding: 12px; font-size: 13px; text-transform: uppercase; }
        td { padding: 12px; border-bottom: 1px solid #eee; vertical-align: middle; }
        .product-img { width: 60px; height: 60px; object-fit: cover; border-radius: 6px; border: 1px solid #eee; }
        .total-section { display: flex; justify-content: flex-end; }
        .total-box { width: 300px; background: var(--primary); color: white; padding: 20px; border-radius: 8px; text-align: right; }
        .total-box h3 { margin: 0; font-size: 22px; }
        .print-btn { display: block; width: 220px; margin: 30px auto 0; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 16px; }
        @media print { .print-btn { display: none; } body { padding: 0; background: white; } .invoice-container { box-shadow: none; max-width: 100%; } }
        .loading-screen { text-align: center; padding: 100px 0; }
    </style>
</head>
<body>

    <div id="main-content">
        <div class="loading-screen">
            <h2 style="color: #666;">Generating Invoice...</h2>
        </div>
    </div>

    <script>
        (function() {
            const urlParams = new URLSearchParams(window.location.search);
            const data = urlParams.get('data');
            const direct = urlParams.get('direct');

            if (!data && !direct) {
                document.getElementById('main-content').innerHTML = "<h2>No invoice data found.</h2>";
                return;
            }

            // Function to find product data
            function getProduct(id) {
                if (typeof products !== 'undefined' && products) {
                    return products.find(p => p.id === id);
                }
                return null;
            }

            try {
                let decoded;
                if (direct) {
                    // Handle Direct JSON link (direct is already decoded by URLSearchParams)
                    decoded = JSON.parse(direct);
                } else {
                    // Decode URL-Safe Base64 (data is already decoded by URLSearchParams)
                    let base64 = data.replace(/-/g, '+').replace(/_/g, '/');
                    while (base64.length % 4) base64 += '=';
                    const decodedStr = decodeURIComponent(escape(atob(base64)));
                    decoded = JSON.parse(decodedStr);
                }
                
                const order = {
                    id: "ORD-RO-" + (decoded[0] || "XXXX"),
                    name: decoded[1] || "Customer",
                    phone: decoded[2] || "-",
                    address: decoded[3] || "-",
                    city: decoded[4] || "-",
                    note: decoded[5] || "",
                    items: decoded[6] || [],
                    date: new Date().toLocaleDateString()
                };

                let itemsHtml = '';
                let grandTotal = 0;

                order.items.forEach(item => {
                    if (!item) return;
                    const productId = item[0];
                    const price = item[3] || 0;
                    const qty = item[2] || 1;
                    const subtotal = price * qty;
                    grandTotal += subtotal;

                    const p = getProduct(productId);
                    const pName = p ? (p.name || "Product #" + productId) : "Product #" + productId;
                    const pImg = (p && p.images && p.images[0]) ? p.images[0] : "https://via.placeholder.com/60?text=Item";

                    itemsHtml += `
                        <tr>
                            <td style="width: 70px;"><img src="${pImg}" class="product-img" onerror="this.src='https://via.placeholder.com/60?text=No+Img'"></td>
                            <td>
                                <div style="font-weight: bold; font-size: 15px;">${pName}</div>
                                <div style="font-size: 12px; color: #666;">Size: ${item[1] || 'N/A'}</div>
                            </td>
                            <td style="text-align: center;">${qty}</td>
                            <td style="text-align: right;">Rs. ${price.toLocaleString()}</td>
                            <td style="text-align: right; font-weight: bold;">Rs. ${subtotal.toLocaleString()}</td>
                        </tr>
                    `;
                });

                const finalHtml = `
                    <div class="invoice-container">
                        <div class="header">
                            <div class="logo-section">
                                <h1>ROOHIRA COLLECTION</h1>
                                <p style="font-size: 12px; color: #888; margin: 0;">PREMIUM CLOTHING LINE</p>
                            </div>
                            <div class="order-info">
                                <h2 style="margin: 0; color: #444;">INVOICE</h2>
                                <p style="margin: 5px 0 0 0; font-weight: bold;">ID: ${order.id}</p>
                                <p style="margin: 2px 0 0 0; font-size: 14px; color: #666;">Date: ${order.date}</p>
                            </div>
                        </div>

                        <div class="details-grid">
                            <div class="customer-info">
                                <h4 style="margin: 0 0 10px 0; color: var(--primary); text-transform: uppercase; font-size: 11px;">Bill To:</h4>
                                <div style="font-size: 17px; font-weight: bold;">${order.name}</div>
                                <div style="font-size: 13px; color: #555;">${order.phone}</div>
                                <div style="font-size: 13px; color: #555;">${order.address}, ${order.city}</div>
                            </div>
                            <div class="business-info">
                                <h4 style="margin: 0 0 10px 0; color: var(--primary); text-transform: uppercase; font-size: 11px;">From:</h4>
                                <div style="font-size: 17px; font-weight: bold;">ROOHIRA COLLECTION</div>
                                <div style="font-size: 13px; color: #555;">Kadawatha, Sri Lanka</div>
                                <div style="font-size: 14px; color: #555; margin-top: 5px;"><strong>Call:</strong> 0729057972</div>
                            </div>
                        </div>

                        <table>
                            <thead>
                                <tr>
                                    <th colspan="2">Description</th>
                                    <th style="text-align: center;">Qty</th>
                                    <th style="text-align: right;">Price</th>
                                    <th style="text-align: right;">Total</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${itemsHtml}
                            </tbody>
                        </table>

                        <div class="total-section">
                            <div class="total-box">
                                <div style="font-size: 14px; opacity: 0.9;">Grand Total</div>
                                <h3>Rs. ${grandTotal.toLocaleString()}</h3>
                            </div>
                        </div>

                        <button class="print-btn" onclick="window.print()">Print / Save PDF</button>

                        <div class="footer">
                            <p>Thank you for shopping with ROOHIRA COLLECTION!</p>
                            <p>© 2026 ROOHIRA COLLECTION. ALL RIGHTS RESERVED.</p>
                        </div>
                    </div>
                `;

                // Render after a small delay to ensure images display
                setTimeout(() => {
                    document.getElementById('main-content').innerHTML = finalHtml;
                    
                    // Auto-print if print=1 is in URL
                    const isPrint = urlParams.get('print') === '1';
                    if (isPrint) {
                        setTimeout(() => window.print(), 1000);
                    }
                }, 200);

            } catch (err) {
                console.error("Decoding Error:", err);
                document.getElementById('main-content').innerHTML = `
                    <div class="error-screen">
                        <h2>Oops! Invoice Error</h2>
                        <p>We couldn't read the bill data from this link.</p>
                        <div style="margin-top: 15px; background: white; padding: 10px; border-radius: 5px; font-size: 11px; color: #888; text-align: left; border: 1px solid #ddd;">
                            <b>Error:</b> ${err.message}<br>
                            <b>Data:</b> ${data ? data.substring(0, 40) + "..." : "Empty"}
                        </div>
                        <button onclick="location.href='index.html'" style="margin-top: 15px; padding: 8px 15px; cursor: pointer;">Back to Home</button>
                    </div>
                `;
            }
        })();
    </script>
</body>
</html>
